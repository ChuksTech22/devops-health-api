apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-health-api
  template:
    metadata:
      labels:
        app: devops-health-api
    spec:
      containers:
        - name: devops-health-api
          image: devops-health-api:latest
          ports:
            - containerPort: 8000
